# Base44 development environment for the "AI Agents for Beginners" course.
#
# This repository is an educational course: 18 lesson folders containing
# Markdown lessons and Jupyter notebooks (run with Microsoft Agent Framework
# against Microsoft Foundry). There is no web application, so the user-facing
# surface is a Jupyter server serving the repository on port 3000.
services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /workspace
    # JupyterLab, bound to all interfaces so the preview proxy can reach it.
    # Token auth is disabled: this is a sandboxed development preview, and the
    # preview iframe cannot complete an interactive token login.
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=3000
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/workspace
      - --ServerApp.default_url=/lab
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.allow_remote_access=True
      - --ServerApp.allow_origin=*
      - --ServerApp.disable_check_xsrf=True
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      # Live source: lesson edits and notebook executions land in the repo.
      - .:/workspace
    env_file:
      - ./.env.base44-defaults   # non-secret defaults (placeholders)
      - /run/base44/app.env      # platform-managed secrets — always wins
    healthcheck:
      # Real responsiveness check against the Jupyter server API.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/status',
          timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
